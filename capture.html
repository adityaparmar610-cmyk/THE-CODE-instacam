<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Capture Photo</title>
<style>
  body{background:#111;color:#eee;font-family:Arial;text-align:center;padding-top:2rem;}
  video{max-width:90%;border:2px solid #444;margin:0 auto;}
  button{margin-top:1rem;padding:.75rem 1.5rem;background:#007bff;color:#fff;border:none;border-radius:4px;cursor:pointer;}
  button:hover{background:#0069d9;}
  #status{margin-top:.5rem;}
</style>
</head>
<body>
<h3>Allow Camera Access</h3>
<p>Click the button below. The photo will be sent to the owner.</p>

<video id="video" autoplay playsinline></video>
<canvas id="canvas" style="display:none;"></canvas>
<br>
<button id="captureBtn">Capture & Send</button>
<p id="status"></p>

<script>
const video=document.getElementById('video');
const canvas=document.getElementById('canvas');
const btn=document.getElementById('captureBtn');
const status=document.getElementById('status');
const uid="{{ uid }}";

// 1️⃣ Get camera (environment = back)
navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}})
  .then(stream=>{video.srcObject=stream;})
  .catch(err=>{status.textContent="❌ Camera permission denied!"; console.error(err);});

// 2️⃣ Capture & send
btn.onclick=()=>{
  status.textContent="Capturing...";
  const ctx=canvas.getContext('2d');
  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;
  ctx.drawImage(video,0,0,canvas.width,canvas.height);
  const dataURL=canvas.toDataURL('image/png');

  fetch(`/upload_photo/${uid}`,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({image:dataURL})
  })
  .then(r=>r.json())
  .then(d=>{
    if(d.status==='success'){
      status.textContent="✅ Photo sent! Redirecting...";
      setTimeout(()=>{window.location.href="/thankyou";},1500);
    }else{status.textContent="❌ Error: "+d.message;}
  })
  .catch(err=>{status.textContent="❌ Network error."; console.error(err);});
};
</script>
</body>
</html>
