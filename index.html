<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Share Your Photo</title>
<style>
  body{font-family:'Segoe UI',Arial;background:#222;color:#eee;text-align:center;padding:2rem;}
  .box{border:1px solid #888;padding:1.5rem;border-radius:8px;max-width:400px;margin:auto;background:#333;}
  input{width:100%;padding:.5rem;border:1px solid #555;border-radius:4px;margin-top:.5rem;}
  button{padding:.75rem 1.5rem;background:#28a745;color:#fff;border:none;border-radius:4px;margin-top:1rem;cursor:pointer;}
  button:hover{background:#218838;}
</style>
</head>
<body>
<div class="box">
  <h2>Generate a Share Link</h2>
  <p>Send this URL to anyone. They’ll be asked for camera access, take a photo, and it will be sent back to you.</p>
  <input id="link" type="text" value="{{ link }}" readonly>
  <button onclick="copyLink()">Copy Link</button>
</div>
<script>
function copyLink(){
  const el=document.getElementById('link');
  el.select(); el.setSelectionRange(0, 99999);
  document.execCommand('copy');
  alert('Link copied to clipboard!');
}
</script>
</body>
</html>
